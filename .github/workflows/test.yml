name: NEXORA Python tests
on:
  push:
    branches:
      - main
      - feature/nexora-autopilot-research-v06
      - feature/p0-01-isolamento-config-demo-real
      - feature/p0-02-safe-unresolved-recovery
      - feature/p0-03-integridade-concorrencia
      - feature/p0-04-consistencia-reinicio
      - feature/p0-05-status-capacidade
      - fix/f01-real-stop-cross-process
      - feature/intelligence20-market-data-readonly
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXORA_DEMO_BUY_ENABLED: "false"
      NEXORA_REAL_AUTOPILOT_ENABLED: "false"
      NEXORA_REAL_RELEASE_APPROVED: "false"
      NEXORA_PUBLIC_URL: "http://localhost:8000"
      DATABASE_URL: "sqlite:///./nexora_ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate ephemeral test-only encryption key
        run: echo "NEXORA_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Intelligence 2.0 I01 public-data integration (mock-only)
        run: python -m pytest -q tests/test_intelligence2_market_data.py
      - name: Unit and integration-mock tests
        run: python -m pytest -q --ignore=tests/test_readonly_dashboard_load.py
      - name: Local synthetic 10-user read-only latency probe
        run: python -m pytest -q -s tests/test_readonly_dashboard_load.py

  postgres-p0-isolation:
    if: github.ref == 'refs/heads/feature/p0-01-isolamento-config-demo-real' || github.ref == 'refs/heads/feature/p0-02-safe-unresolved-recovery' || github.ref == 'refs/heads/feature/p0-03-integridade-concorrencia' || github.ref == 'refs/heads/feature/p0-04-consistencia-reinicio' || github.ref == 'refs/heads/feature/p0-05-status-capacidade' || github.ref == 'refs/heads/fix/f01-real-stop-cross-process' || github.ref == 'refs/heads/feature/intelligence20-market-data-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: p0_ci
          POSTGRES_PASSWORD: test_only_disposable
          POSTGRES_DB: nexora_p0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p0_ci -d nexora_p0_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NEXORA_P0_EPHEMERAL_PG: "yes"
      NEXORA_P0_TEST_DATABASE_URL: "postgresql+psycopg://p0_ci:test_only_disposable@127.0.0.1:5432/nexora_p0_ci"
      DATABASE_URL: "postgresql+psycopg://p0_ci:test_only_disposable@127.0.0.1:5432/nexora_p0_ci"
      NEXORA_DEMO_BUY_ENABLED: "false"
      NEXORA_AUTOPILOT_DEMO_ENABLED: "false"
      NEXORA_REAL_AUTOPILOT_ENABLED: "false"
      NEXORA_REAL_RELEASE_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate ephemeral F01-only authentication test key
        if: github.ref == 'refs/heads/fix/f01-real-stop-cross-process' || github.ref == 'refs/heads/feature/intelligence20-market-data-readonly'
        run: echo "NEXORA_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Validate additive PostgreSQL migration and reversible backout
        run: |
          cases=(tests/test_postgres_mode_isolation.py tests/test_postgres_p002_recovery.py tests/test_postgres_p003_integrity.py tests/test_postgres_p004_restart.py)
          if [[ "$GITHUB_REF" == "refs/heads/feature/p0-05-status-capacidade" || "$GITHUB_REF" == "refs/heads/fix/f01-real-stop-cross-process" || "$GITHUB_REF" == "refs/heads/feature/intelligence20-market-data-readonly" ]]; then
            cases+=(tests/test_postgres_p005_status.py)
          fi
          if [[ "$GITHUB_REF" == "refs/heads/fix/f01-real-stop-cross-process" || "$GITHUB_REF" == "refs/heads/feature/intelligence20-market-data-readonly" ]]; then
            cases+=(tests/test_postgres_f01_real_stop.py tests/test_postgres_f01_schema_guard.py tests/test_postgres_f01_migration_validation.py)
          fi
          python -m pytest -q -s "${cases[@]}"

  browser-p0-visual:
    if: github.ref == 'refs/heads/feature/p0-01-isolamento-config-demo-real' || github.ref == 'refs/heads/feature/p0-05-status-capacidade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXORA_DEMO_BUY_ENABLED: "false"
      NEXORA_REAL_AUTOPILOT_ENABLED: "false"
      NEXORA_REAL_RELEASE_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated browser test dependency
        run: python -m pip install playwright
      - name: Install Chromium for offline visual review
        run: python -m playwright install --with-deps chromium
      - name: Inspect NEXORA status in Chromium with synthetic accounts only
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/feature/p0-05-status-capacidade" ]]; then
            python tests/browser_visual_p005.py
          else
            python tests/browser_visual_p001.py
          fi
