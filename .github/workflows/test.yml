name: NEXORA Python tests
on:
  push:
    branches:
      - main
      - feature/nexora-autopilot-research-v06
      - release/intelligence20-i01-i03-readonly-main-isolated
      - feature/intelligence20-i06-research-evidence
      - feature/intelligence20-research-orchestrator-i01-i06
      - feature/intelligence20-i04-research-orchestrator-adapter
      - feature/intelligence20-i05-research-orchestrator-adapter
      - feature/intelligence20-integrated-research-consolidation
      - feature/intelligence20-i05-research-orchestrator-adapter
      - feature/intelligence20-integrated-research-consolidation
      - feature/intelligence20-stage2-distributed-research
      - feature/intelligence20-first-functional-homologation
  pull_request:
    branches:
      - main
      - feature/intelligence20-stage2-distributed-research
      - feature/intelligence20-i06-research-evidence
      - feature/intelligence20-research-orchestrator-i01-i06
      - feature/intelligence20-i04-research-orchestrator-adapter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXORA_DEMO_BUY_ENABLED: "false"
      NEXORA_INTELLIGENCE_READONLY_ENABLED: "false"
      NEXORA_INTELLIGENCE_I06_RESEARCH_ENABLED: "false"
      NEXORA_REAL_AUTOPILOT_ENABLED: "false"
      NEXORA_REAL_RELEASE_APPROVED: "false"
      NEXORA_PUBLIC_URL: "http://localhost:8000"
      DATABASE_URL: "sqlite:///./nexora_ci.db"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate ephemeral test-only encryption key
        run: echo "NEXORA_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Reject financial or schema changes in isolated I01-I03 release (pre/post merge)
        run: python scripts/research_release_diff_guard.py
      - name: Test release CI guard on actual PR and merged commit history
        run: python -m pytest -q tests/test_ci_research_release_diff_guard.py
      - name: Intelligence I01-I03 research tests, feature default OFF
        run: python -m pytest -q tests/test_intelligence2_market_data.py tests/test_intelligence2_market_scanner.py tests/test_intelligence2_context_timeframe.py tests/test_intelligence2_main_isolated_release.py
      - name: I06 evidence and authenticated research API regression (opt-in default OFF)
        run: python -m pytest -q tests/test_intelligence2_i06_research_signal.py
      - name: Research orchestrator I01-I03-I06 quality, provenance and isolation
        run: python -m pytest -q tests/test_intelligence2_research_orchestrator.py
      - name: I04 adapter public retrieval, lineage, regime and fail-closed regression
        run: python -m pytest -q tests/test_intelligence2_i04_research_adapter.py
      - name: I05 read-only model release, public OOS validation, Champion Fallback and no promotion
        run: python -m pytest -q tests/test_intelligence2_i05_research_adapter.py
      - name: Real I04/I05 persistence contract integration (disposable SQLite)
        run: python -m pytest -q tests/test_intelligence20_consolidated_real_persistence.py
      - name: Real persisted I05 Champion/Challenger/Fallback/OOS/rollback lifecycle
        run: python -m pytest -q tests/test_intelligence20_real_i05_lifecycle.py
      - name: Public research priorities and progressive in-process read load
        run: python -m pytest -q -s tests/test_intelligence20_public_decision_load.py
      - name: Authenticated robot homologation read-only views and disabled production gates
        run: python -m pytest -q tests/test_intelligence20_homologation_runtime.py
      - name: Unit and integration-mock tests
        run: python -m pytest -q

  postgres-public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: nexora_public_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d nexora_public_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://research:disposable@127.0.0.1:5432/nexora_public_test
      NEXORA_CONSOLIDATION_TEST_DATABASE_URL: postgresql+psycopg://research:disposable@127.0.0.1:5432/nexora_public_test
      NEXORA_INTELLIGENCE_READONLY_ENABLED: "false"
      NEXORA_INTELLIGENCE_KNOWLEDGE_ENABLED: "false"
      NEXORA_INTELLIGENCE_LEARNING_ENABLED: "false"
      NEXORA_INTELLIGENCE_LEARNING_PROMOTION_ENABLED: "false"
      NEXORA_REAL_AUTOPILOT_ENABLED: "false"
      NEXORA_REAL_RELEASE_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate disposable encryption key
        run: echo "NEXORA_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Real I04/I05 persistence and recovery on disposable PostgreSQL
        run: python -m pytest -q tests/test_intelligence20_consolidated_real_persistence.py
      - name: Real I05 champion/fallback lifecycle on disposable PostgreSQL
        run: python -m pytest -q tests/test_intelligence20_real_i05_lifecycle.py
      - name: Full I01-I06 public research to I04/I05 through PostgreSQL and authenticated homologation GET
        run: python -m pytest -q -s tests/test_intelligence20_public_coordination_pg.py

