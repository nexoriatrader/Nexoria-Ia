name: NEXORA production public smoke check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    name: Check public HTTP health and session boundary
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Render public routes without credentials
        env:
          NEXORA_URL: https://nexoria-ia.onrender.com
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base=os.environ["NEXORA_URL"].rstrip("/")
          checks=[
            ("/healthz",lambda payload: payload.get("ok") is True),
            ("/api/session",lambda payload: payload.get("authenticated") is False)
          ]
          for path,valid in checks:
              last_error=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(base+path,headers={
                          "User-Agent":"NEXORA-Release-Smoke/1.0","Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=30) as res:
                          if res.status!=200:
                              raise ValueError("Unexpected HTTP status")
                          payload=json.load(res)
                      if not isinstance(payload,dict) or not valid(payload):
                          raise ValueError("Unexpected endpoint response")
                      print(path, "OK: HTTP 200 with expected public structure")
                      last_error=None
                      break
                  except (urllib.error.URLError,ValueError,TimeoutError,OSError) as exc:
                      last_error=type(exc).__name__
                      print(path,"attempt",attempt,"failed:",last_error)
                      time.sleep(5)
              if last_error:
                  raise SystemExit(path+" unavailable after retries: "+last_error)
          PY
