name: NEXORA production public smoke check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    name: Check public HTTP health and session boundary
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Render public routes without credentials
        env:
          NEXORA_URL: https://nexoria-ia.onrender.com
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base=os.environ["NEXORA_URL"].rstrip("/")
          checks=[
            ("/healthz",lambda payload: payload.get("ok") is True),
            ("/api/session",lambda payload: payload.get("authenticated") is False)
          ]
          for path,valid in checks:
              last_error=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(base+path,headers={
                          "User-Agent":"NEXORA-Release-Smoke/1.0","Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=30) as res:
                          if res.status!=200:
                              raise ValueError("Unexpected HTTP status")
                          payload=json.load(res)
                      if not isinstance(payload,dict) or not valid(payload):
                          raise ValueError("Unexpected endpoint response")
                      print(path, "OK: HTTP 200 with expected public structure")
                      last_error=None
                      break
                  except (urllib.error.URLError,ValueError,TimeoutError,OSError) as exc:
                      last_error=type(exc).__name__
                      print(path,"attempt",attempt,"failed:",last_error)
                      time.sleep(5)
              if last_error:
                  raise SystemExit(path+" unavailable after retries: "+last_error)
          # Read-only checks: never call login, activation, or purchase endpoints.
          protected_paths=(
              "/api/status",
              "/api/automation/profile",
              "/api/demo/orders",
              "/api/real/orders",
          )
          for path in protected_paths:
              last_error=None
              for attempt in range(1,3):
                  try:
                      req=urllib.request.Request(base+path,headers={
                          "User-Agent":"NEXORA-Release-Smoke/1.0",
                          "Accept":"application/json"})
                      try:
                          with urllib.request.urlopen(req,timeout=15) as res:
                              raise ValueError("Sensitive route unexpectedly exposed: HTTP "+str(res.status))
                      except urllib.error.HTTPError as exc:
                          if exc.code!=401:
                              raise ValueError("Expected HTTP 401, got HTTP "+str(exc.code)) from exc
                          if "no-store" not in exc.headers.get("Cache-Control","").lower():
                              raise ValueError("Unauthorized response not marked no-store")
                      print(path,"OK: anonymous access rejected (HTTP 401, no-store)")
                      last_error=None
                      break
                  except (urllib.error.URLError,ValueError,TimeoutError,OSError) as exc:
                      last_error=type(exc).__name__
                      print(path,"attempt",attempt,"failed:",last_error)
                      if attempt<2:
                          time.sleep(3)
              if last_error:
                  raise SystemExit(path+" failed anonymous-access check: "+last_error)
          PY
