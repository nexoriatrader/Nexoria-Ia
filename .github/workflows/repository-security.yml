name: NEXORA repository security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-scan:
    name: Scan tracked repository files for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan tracked files (without printing secrets)
        run: python3 scripts/check_repository_security.py
      - name: Scan reachable Git history for credential signatures
        run: python3 scripts/check_repository_history.py
