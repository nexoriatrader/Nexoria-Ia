name: NEXORA progression safety regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXORA_DEMO_BUY_ENABLED: "false"
      NEXORA_PUBLIC_URL: "http://localhost:8000"
      DATABASE_URL: "sqlite:///./nexora_ci_progression.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate isolated test-only encryption key
        run: echo "NEXORA_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Validate progression and broker-order safeguards
        run: python -m pytest -q tests/test_real_ledger.py tests/test_real_broker.py tests/test_market_sharing.py tests/test_progression.py tests/test_onboarding.py tests/test_stripe_billing.py tests/test_demo_ledger.py tests/test_zero_stops.py tests/test_autopilot_v2.py::test_martingale_recovery_keeps_symbol_and_original_direction tests/test_autopilot_v2.py::test_recovery_queue_prefers_oldest_settled_loss_not_latest_id tests/test_autopilot_v2.py::test_parallel_pending_and_unknown_lock_only_their_symbol tests/test_autopilot_v2.py::test_cycle_only_uses_new_signal_any_symbol_and_resets_on_win tests/test_autopilot_v2.py::test_exhausted_cycles_rearm_base_for_fresh_signal_across_assets tests/test_autopilot_v2.py::test_cycle_only_blocks_until_all_official_orders_settle tests/test_autopilot_v2.py::test_martingale_dispatch_only_at_next_matching_candle tests/test_reconciliation_latency.py tests/test_demo_endpoints.py::test_auto_reconcile_persists_only_broker_settlement tests/test_demopilot.py::test_reconciliation_prioritizes_recent_contracts
