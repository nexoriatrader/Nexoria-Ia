name: NEXORA main-based research PostgreSQL 17.11 compatibility
on:
  push:
    branches:
      - release/intelligence20-i01-i03-readonly-main-isolated
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-pg17-disposable:
    if: github.ref == 'refs/heads/release/intelligence20-i01-i03-readonly-main-isolated' || github.head_ref == 'release/intelligence20-i01-i03-readonly-main-isolated'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: p0_ci
          POSTGRES_PASSWORD: test_only_disposable
          POSTGRES_DB: nexora_p0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p0_ci -d nexora_p0_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NEXORA_P0_EPHEMERAL_PG: "yes"
      NEXORA_P0_TEST_DATABASE_URL: "postgresql+psycopg://p0_ci:test_only_disposable@127.0.0.1:5432/nexora_p0_ci"
      DATABASE_URL: "postgresql+psycopg://p0_ci:test_only_disposable@127.0.0.1:5432/nexora_p0_ci"
      NEXORA_INTELLIGENCE_READONLY_ENABLED: "false"
      NEXORA_DEMO_BUY_ENABLED: "false"
      NEXORA_REAL_AUTOPILOT_ENABLED: "false"
      NEXORA_REAL_RELEASE_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated requirements
        run: python -m pip install -r requirements.txt
      - name: Disposable test encryption key
        run: echo "NEXORA_FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Verify exact PostgreSQL patch and main schema without F01/I04
        run: python -m pytest -q tests/test_postgres17_main_research_release.py
