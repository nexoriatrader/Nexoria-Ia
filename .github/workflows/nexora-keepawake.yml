name: NEXORA IA — Monitor temporário do Render

# O Render Free dorme depois de 15 minutos sem tráfego.
# GitHub Actions cron não garante execução pontual e pode consumir a cota mensal.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-render-monitor
  cancel-in-progress: false

jobs:
  keepalive:
    name: Consultar saúde do NEXORA
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: GET público da rota /healthz
        env:
          NEXORA_HEALTH_URL: https://nexoria-ia.onrender.com/healthz
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['NEXORA_HEALTH_URL']
          print('Monitorando:',url)
          for attempt in range(1, 3):
              try:
                  request = urllib.request.Request(
                      url,headers={'User-Agent':'NEXORA-IA-Temporary-Render-Monitor/1.0',
                                   'Accept':'application/json'})
                  with urllib.request.urlopen(request,timeout=105) as response:
                      payload=json.load(response)
                      if response.status != 200 or payload.get('ok') is not True:
                          raise RuntimeError('O endpoint não confirmou saúde')
                      print('NEXORA respondeu: HTTP 200, ok=true')
                  break
              except Exception as error:
                  print('Tentativa',attempt,'falhou:',type(error).__name__,str(error)[:180])
                  if attempt==2:
                      raise
                  time.sleep(8)
          PY
