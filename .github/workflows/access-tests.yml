name: NEXORA access and referral tests
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_access.py tests/test_referral_admin.py
